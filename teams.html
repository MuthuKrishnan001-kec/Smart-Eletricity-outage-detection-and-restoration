<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live repair team status for SmartGrid Monitor." />
    <title>SmartGrid Monitor | Repair Teams</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-text">SmartGrid Monitor</div>
        </div>
        <nav class="nav" aria-label="Sidebar navigation">
          <a class="nav-item" href="index.html"><span class="nav-icon">▣</span> Dashboard</a>
          <a class="nav-item" href="network.html"><span class="nav-icon">◎</span> Network Overview</a>
          <a class="nav-item" href="outages.html"><span class="nav-icon">⚠</span> Outage Monitoring</a>
          <a class="nav-item active" href="teams.html"><span class="nav-icon">👥</span> Repair Teams</a>
          <a class="nav-item" href="history.html"><span class="nav-icon">◫</span> History</a>
          <a class="nav-item" href="settings.html"><span class="nav-icon">⚙</span> Settings</a>
        </nav>
        <div class="sidebar-footer">Live Java restoration workflow</div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="page-heading"><h1>Repair Teams</h1></div>
          <div class="topbar-meta">
            <span class="status-pill" data-api-status role="status">Connecting…</span>
            <a class="header-action" href="teams.html">Refresh</a>
          </div>
        </header>
        <main class="content">
          <article class="card panel">
            <div class="panel-header">
              <h2 class="panel-title">Repair team availability</h2>
              <span class="muted">Assignment and estimated repair time</span>
            </div>
            <div class="table-wrap">
              <table id="teamsTable" class="table">
                <thead>
                  <tr>
                    <th>Team ID</th>
                    <th>Name</th>
                    <th>Depot</th>
                    <th>Status</th>
                    <th>Assigned Fault</th>
                    <th>Estimated Repair Time</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </article>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
